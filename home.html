{% extends 'base.html' %}

{% block title %}
Home
{% endblock %}

{% block content %}

<div class="container mt-4">

    <h2>Products</h2>

    <div class="row">

        {% for product in ab %}

        <div class="col-md-4">

            <div class="card mb-4">

                {% if product.img %}
                <img src="{{ product.img.url }}"
                     class="card-img-top"
                     height="200">
                {% endif %}

                <div class="card-body">

                    <h5>{{ product.name }}</h5>

                    <p>{{ product.description }}</p>

                    <p>Price: ₹{{ product.price }}</p>

                    <p>Stock: {{ product.stock }}</p>

                    <a href="/addcart/{{ product.id }}"
                       class="btn btn-primary">
                        Add to Cart
                    </a>

                </div>

            </div>

        </div>

        {% endfor %}

    </div>

</div>

{% endblock %}
